<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#101820">
  <title>Telegram Survivor</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <main id="game">
    <canvas id="arena" aria-label="Игровое поле"></canvas>
    <header class="hud">
      <div class="stat"><span>❤</span><b id="hp">100</b></div>
      <div class="stat"><span>✦</span><b id="level">1</b></div>
      <div class="stat"><span>⏱</span><b id="time">00:00</b></div>
      <div class="stat"><span>☠</span><b id="kills">0</b></div>
      <button id="pause-btn" class="pause-btn" aria-label="Пауза">Ⅱ</button><div class="build">v0.0.01</div>
    </header>
    <div class="xp-wrap"><div id="xp-bar"></div></div>
    <div id="boss-wrap" class="boss-wrap hidden"><div class="boss-label">БОСС</div><div class="boss-track"><div id="boss-hp"></div></div></div>
    <section id="start-screen" class="overlay">
      <div class="panel">
        <div class="logo">TELEGRAM<br><strong>SURVIVOR</strong></div>
        <p>Выживи как можно дольше.<br>Собирай опыт и становись сильнее.</p>
        <button id="start-btn" class="primary">НАЧАТЬ ИГРУ</button>
        <small>Управление: перемещай палец по экрану</small>
      </div>
    </section>
    <section id="pause-screen" class="overlay hidden"><div class="panel"><h2>ПАУЗА</h2><p>Передохни. Твои результаты сохранены.</p><button id="resume-btn" class="primary">ПРОДОЛЖИТЬ</button></div></section>
    <section id="upgrade-screen" class="overlay hidden">
      <div class="panel"><h2>НОВЫЙ УРОВЕНЬ</h2><p>Выбери улучшение</p><div id="upgrade-options" class="choices"></div></div>
    </section>
    <section id="gameover-screen" class="overlay hidden">
      <div class="panel"><h2>ТЫ ПОГИБ</h2><p id="final-stats"></p><button id="restart-btn" class="primary">ЕЩЁ РАЗ</button></div>
    </section>
    <div id="toast" class="toast hidden"></div>
  </main>
  <script src="game.js"></script>
</body>
</html>
